    // ── Canvas image export ────────────────────────────────────────────────────
    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
      ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
      ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
      ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
    }

    async function generateShareImage(bosses, subtitle) {
      const COLS     = Math.min(bosses.length, 5);
      const CARD_W   = 120, CARD_H = 148, PAD = 8;
      const HDR_H    = 78,  FTR_H  = 32;
      const rows     = Math.ceil(bosses.length / COLS);
      const W        = PAD + COLS*(CARD_W+PAD);
      const H        = HDR_H + rows*(CARD_H+PAD) + PAD + FTR_H;

      const canvas   = document.createElement("canvas");
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext("2d");

      // Background
      ctx.fillStyle = "#0d1117";
      ctx.fillRect(0, 0, W, H);

      // Header gradient
      const grad = ctx.createLinearGradient(0,0,W,0);
      grad.addColorStop(0,"#0e1f40"); grad.addColorStop(1,"#1c0a38");
      ctx.fillStyle = grad; ctx.fillRect(0,0,W,HDR_H);

      ctx.textAlign = "center";
      ctx.fillStyle = "#F6C614";
      ctx.font = "bold 18px system-ui,sans-serif";
      ctx.fillText("GO 2026 — Raid Wish List", W/2, 30);
      ctx.fillStyle = "#6e88b3";
      ctx.font = "12px system-ui,sans-serif";
      ctx.fillText(subtitle || `${bosses.length} raids I need help with!`, W/2, 52);
      ctx.fillStyle = "#2a3550";
      ctx.fillRect(0, HDR_H-1, W, 1);

      // Load images (PokeMiners has CORS headers, so safe for canvas)
      const loadImg = src => new Promise(res => {
        const im = new Image(); im.crossOrigin = "anonymous";
        im.onload = () => res(im); im.onerror = () => res(null);
        im.src = src;
      });
      const imgs = await Promise.all(bosses.map(b => loadImg(b.img)));

      // Draw cards
      bosses.forEach((boss, idx) => {
        const col = idx % COLS;
        const row = Math.floor(idx / COLS);
        const x = PAD + col*(CARD_W+PAD);
        const y = HDR_H + PAD + row*(CARD_H+PAD);

        // Card bg
        ctx.fillStyle = "#161b22";
        roundRect(ctx, x, y, CARD_W, CARD_H, 7); ctx.fill();
        ctx.strokeStyle = "#21262d"; ctx.lineWidth = 1;
        roundRect(ctx, x, y, CARD_W, CARD_H, 7); ctx.stroke();

        // Sprite
        if (imgs[idx]) {
          ctx.drawImage(imgs[idx], x+(CARD_W-72)/2, y+6, 72, 72);
        } else {
          ctx.fillStyle = "#1c2030";
          roundRect(ctx, x+24, y+12, 72, 60, 5); ctx.fill();
          ctx.fillStyle = "#30363d"; ctx.font = "22px sans-serif"; ctx.textAlign = "center";
          ctx.fillText("?", x+CARD_W/2, y+48);
        }

        // Name
        ctx.fillStyle = "#c9d1d9";
        ctx.font = "bold 10px system-ui,sans-serif"; ctx.textAlign = "center";
        const name = boss.name.length > 17 ? boss.name.slice(0,15)+"…" : boss.name;
        ctx.fillText(name, x+CARD_W/2, y+88);

        // Type badges
        const bw = 52, bh = 15, bgap = 4;
        const totalW = boss.types.length*bw + (boss.types.length-1)*bgap;
        let bx = x + (CARD_W - totalW)/2;
        boss.types.forEach(type => {
          const tc = TYPE_COLORS[type] || {bg:"#555",tx:"#fff"};
          ctx.fillStyle = tc.bg;
          roundRect(ctx, bx, y+95, bw, bh, 3); ctx.fill();
          ctx.fillStyle = tc.tx;
          ctx.font = "bold 8px system-ui,sans-serif"; ctx.textAlign = "center";
          ctx.fillText(type.toUpperCase(), bx+bw/2, y+106);
          bx += bw + bgap;
        });

        // Regional badge
        if (boss.regional) {
          ctx.fillStyle = "#161e2e";
          roundRect(ctx, x+4, y+116, CARD_W-8, 14, 3); ctx.fill();
          ctx.fillStyle = "#5b84c4"; ctx.font = "7px system-ui,sans-serif"; ctx.textAlign = "center";
          ctx.fillText("REGIONAL: " + boss.regional.toUpperCase(), x+CARD_W/2, y+126);
        }
      });

      // Footer
      ctx.fillStyle = "#21262d"; ctx.fillRect(0, H-FTR_H, W, 1);
      ctx.fillStyle = "#3d4a5c"; ctx.font = "10px system-ui,sans-serif"; ctx.textAlign = "center";
      ctx.fillText("Generated " + new Date().toLocaleDateString(), W/2, H-12);

      try { return canvas.toDataURL("image/png"); }
      catch(e) { return null; }
    }

                <span style={{ fontWeight:700, color:"#F6C614" }}>🏆 Mega Finale — Sep 5–6, 2026</span> — Pure Mega Raids only (no 5-star).
                Habitats rotate hourly, each appearing twice per day. Mega Mewtwo X on Saturday, Mega Mewtwo Y on Sunday.
                Debuts: Mega Chesnaught, Mega Delphox, Mega Greninja, Mega Starmie, Mega Dragonite, Mega Skarmory, Mega Raichu X/Y &amp; more.
                No Remote Raid limit. Extra CP boost for all Mega Evolutions.
              </div>
            )}
            {/* Wild Area notice banner */}
            {(activeTab==="wildarea"||activeTab==="all") && (
              <div style={{ background:"#0b1a1f", border:"1px solid #16404a", borderRadius:8,
                padding:"10px 14px", marginBottom:10, fontSize:11, color:"#5aa0b0", lineHeight:1.5 }}>
                <span style={{ fontWeight:700, color:"#60C8E0" }}>🌿 GO Wild Area 2026: Global — Nov 14–15</span> — 10 AM–6 PM local both days.
                Debuts: Gigantamax Duraludon (6-star Max Battles both days), Dynamax Dialga (Sat), Dynamax Palkia (Sun), Modern Jacket Machamp (3-star).
                Up to 3 free Raid Passes/day (6 with ticket). Raid Kyurem can know Glaciate; Black &amp; White Kyurem raids give Fusion Energy.
              </div>
            )}

            {visibleSections.map(section => {
              const secBosses = section.groups.flatMap(g => g.bosses);
              const secNA     = secBosses.filter(b => state[b.id]?.unavailable).length;
              const secDone   = secBosses.filter(b => state[b.id]?.checked).length;
              const secAvail  = secBosses.length - secNA;
              const isOpen    = !collapsed[section.id];
              const allDone   = secAvail > 0 && secDone === secAvail;

              return (
                <div key={section.id} style={{ marginBottom:10, borderRadius:8,
                  overflow:"hidden", border:"1px solid #1c2030" }}>
                  <div onClick={() => setCollapsed(p => ({ ...p, [section.id]: !p[section.id] }))}
                    style={{ background:"#111722", padding:"10px 14px", cursor:"pointer",
                      display:"flex", alignItems:"center", justifyContent:"space-between", userSelect:"none" }}>
                    <div>
                      <div style={{ fontSize:13, fontWeight:700, color: allDone ? "#3fb950" : "#c9d1d9" }}>
                        {section.title}
                      </div>
                      {section.subtitle && (
                        <div style={{ fontSize:10, color:"#4a6080", marginTop:2 }}>{section.subtitle}</div>
                      )}
                    </div>
                    <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                      <span style={{ fontSize:11, fontWeight:600, color: allDone ? "#3fb950" : "#444" }}>
                        {secDone}/{secAvail}
                      </span>
                      <span style={{ color:"#333", fontSize:10 }}>{isOpen ? "▼" : "▶"}</span>
                    </div>
                  </div>

                  {isOpen && section.groups.map(group => {
                    const rows = group.bosses.filter(b => {
                      if (hideDone && state[b.id]?.checked && !state[b.id]?.unavailable) return false;
                      if (hideNA   && state[b.id]?.unavailable) return false;
                      return true;
                    });
                    if (!rows.length) return null;
                    const tc = TIER_COLORS[group.tier] || "#555";
                    return (
                      <div key={group.tier}>
                        <div style={{ padding:"3px 14px", fontSize:9, fontWeight:800, letterSpacing:1.3,
                          color:tc, background:"#070a0f", textTransform:"uppercase",
                          borderTop:"1px solid #1c2030" }}>{group.tier}</div>
                        {rows.map(boss => (
                          <BossRow key={boss.id} boss={boss} st={state[boss.id]||{}}
                            onCheck={()  => toggleCheck(boss.id)}
                            onUnavail={()=> toggleUnavail(boss.id)}
                            onHundo={()  => toggle(boss.id,"hundo")}
                            onShiny={()  => toggle(boss.id,"shiny")}
                            onNote={v    => set(boss.id,"note",v)}
                          />
                        ))}
                      </div>
                    );
                  })}
                </div>
              );
            })}

            <div style={{ textAlign:"center", marginTop:20 }}>
              <button onClick={() => { if(window.confirm("Reset all progress? This cannot be undone.")) setState({}); }}
                style={{ padding:"7px 18px", borderRadius:6, border:"1px solid #21262d",
                  background:"transparent", color:"#444", cursor:"pointer", fontSize:11 }}>
                Reset all progress
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
