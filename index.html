            {id:"va-genesect",   name:"Genesect",              types:["Bug","Steel"],        img:i("pm649.fNORMAL")},
            {id:"va-genes-d",    name:"Genesect (Douse)",      types:["Bug","Steel"],        img:i("pm649.fDOUSE")},
            {id:"va-genes-s",    name:"Genesect (Shock)",      types:["Bug","Steel"],        img:i("pm649.fSHOCK")},
            {id:"va-genes-b",    name:"Genesect (Burn)",       types:["Bug","Steel"],        img:i("pm649.fBURN")},
            {id:"va-genes-c",    name:"Genesect (Chill)",      types:["Bug","Steel"],        img:i("pm649.fCHILL")},
            {id:"va-nihilego",   name:"Nihilego",              types:["Rock","Poison"],      img:i("pm793")},
            {id:"va-buzzwole",   name:"Buzzwole",              types:["Bug","Fighting"],     img:i("pm794"), regional:"Americas & Greenland"},
            {id:"va-pheromosa",  name:"Pheromosa",             types:["Bug","Fighting"],     img:i("pm795"), regional:"Europe / ME / Africa / India"},
            {id:"va-xurkitree",  name:"Xurkitree",             types:["Electric"],           img:i("pm796"), regional:"Asia-Pacific"},
            {id:"va-celesteela", name:"Celesteela",            types:["Steel","Flying"],     img:i("pm797"), regional:"Southern Hemisphere"},
            {id:"va-kartana",    name:"Kartana",               types:["Grass","Steel"],      img:i("pm798"), regional:"Northern Hemisphere"},
            {id:"va-guzzlord",   name:"Guzzlord",              types:["Dark","Dragon"],      img:i("pm799")},
            {id:"va-necrozma",   name:"Necrozma",              types:["Psychic"],            img:i("pm800")},
            {id:"va-stakataka",  name:"Stakataka",             types:["Rock","Steel"],       img:i("pm805"), regional:"Eastern Hemisphere"},
            {id:"va-blacepha",   name:"Blacephalon",           types:["Fire","Ghost"],       img:i("pm806"), regional:"Western Hemisphere"},
            {id:"va-tapukoko",   name:"Tapu Koko",             types:["Electric","Fairy"],   img:i("pm785")},
            {id:"va-tapulele",   name:"Tapu Lele",             types:["Psychic","Fairy"],    img:i("pm786")},
            {id:"va-tapubulu",   name:"Tapu Bulu",             types:["Grass","Fairy"],      img:i("pm787")},
            {id:"va-tapufini",   name:"Tapu Fini",             types:["Water","Fairy"],      img:i("pm788")},
          ]},
        ],
      },
      {
        id:"sun-twilight", tab:"sunday", title:"Twilight Battlefield", subtitle:"Sunday · 4:00 PM – 7:00 PM · Dark / Fairy / Fighting",
        groups:[
          { tier:"Mega", bosses:[
            {id:"tb-mega-tyran", name:"Mega Tyranitar",        types:["Rock","Dark"],        img:i("pm248.fMEGA")},
            {id:"tb-mega-gard",  name:"Mega Gardevoir",        types:["Psychic","Fairy"],    img:i("pm282.fMEGA")},
            {id:"tb-mega-luca",  name:"Mega Lucario",          types:["Fighting","Steel"],   img:i("pm448.fMEGA")},
          ]},
          { tier:"5-Star", bosses:[
            {id:"tb-latias",     name:"Latias",                types:["Dragon","Psychic"],   img:i("pm380")},
            {id:"tb-latios",     name:"Latios",                types:["Dragon","Psychic"],   img:i("pm381")},
            {id:"tb-cresselia",  name:"Cresselia",             types:["Psychic"],            img:i("pm488")},
            {id:"tb-darkrai",    name:"Darkrai",               types:["Dark"],               img:i("pm491")},
            {id:"tb-cobalion",   name:"Cobalion",              types:["Steel","Fighting"],   img:i("pm638")},
            {id:"tb-terrakion",  name:"Terrakion",             types:["Rock","Fighting"],    img:i("pm639")},
            {id:"tb-virizion",   name:"Virizion",              types:["Grass","Fighting"],   img:i("pm640")},
            {id:"tb-zacian-h",   name:"Zacian (Hero)",         types:["Fairy"],              img:i("pm888.fHERO")},
            {id:"tb-zamazenta-h",name:"Zamazenta (Hero)",      types:["Fighting"],           img:i("pm889.fHERO")},
          ]},
        ],
      },
    ];

    const ALL_BOSSES = SECTIONS.flatMap(s => s.groups.flatMap(g => g.bosses));
    const LS_KEY = "gf26";

    function loadState() {
      try { return JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch { return {}; }
    }
    function saveState(s) {
      try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch {}
    }

    // ── Sub-components ─────────────────────────────────────────────────────────
    function TypeBadge({ type }) {
      const c = TYPE_COLORS[type] || { bg:"#555", tx:"#fff" };
      return (
        <span style={{ fontSize:9, fontWeight:700, padding:"2px 5px", borderRadius:3,
          background:c.bg, color:c.tx, textTransform:"uppercase", letterSpacing:.5, lineHeight:1.2 }}>
          {type}
        </span>
      );
    }

    function MiniCheck({ checked, onChange, label, color="#2ea043" }) {
      return (
        <label style={{ display:"flex", alignItems:"center", gap:5, cursor:"pointer", userSelect:"none" }}>
          <div onClick={onChange} style={{
            width:16, height:16, borderRadius:3, flexShrink:0, cursor:"pointer",
            border:`2px solid ${checked ? color : "#30363d"}`,
            background: checked ? color : "transparent",
            display:"flex", alignItems:"center", justifyContent:"center", transition:"all .15s",
          }}>
            {checked && <span style={{ color:"#fff", fontSize:10, lineHeight:1, fontWeight:700 }}>✓</span>}
          </div>
          <span style={{ fontSize:11, color: checked ? color : "#555", fontWeight: checked ? 600 : 400 }}>{label}</span>
        </label>
      );
    }

    function BossRow({ boss, st, onCheck, onUnavail, onHundo, onShiny, onNote }) {
      const [expanded, setExpanded] = useState(false);
      const done = !!st.checked;
      const na   = !!st.unavailable;
      const hasNote = st.note && st.note.trim().length > 0;
      const hasActivity = st.hundo || st.shiny || hasNote;

      return (
        <div style={{ borderBottom:"1px solid #1c2030" }}>
          {/* Main row */}
          <div style={{ display:"flex", alignItems:"center", padding:"7px 12px",
            background: na ? "#080b10" : "#0d1117", gap:9, opacity: na ? .5 : 1, transition:"opacity .2s" }}>

            {/* Checkbox */}
            <div onClick={() => !na && onCheck()} style={{
              width:22, height:22, borderRadius:5, flexShrink:0,
              border: na ? "2px solid #252525" : `2px solid ${done ? "#2ea043" : "#2d333b"}`,
              background: done && !na ? "#2ea043" : "transparent",
              display:"flex", alignItems:"center", justifyContent:"center",
              cursor: na ? "default" : "pointer", transition:"all .15s",
            }}>
              {na  ? <span style={{ fontSize:12 }}>🚫</span>
               : done ? <span style={{ color:"#fff", fontSize:13, lineHeight:1 }}>✓</span>
               : null}
            </div>

            {/* Sprite */}
            <div style={{ width:46, height:46, flexShrink:0, display:"flex", alignItems:"center",
              justifyContent:"center", position:"relative" }}>
              <img src={boss.img} alt={boss.name} width={46} height={46}
                style={{ objectFit:"contain", filter:(done||na) ? "grayscale(.75) brightness(.55)" : "none",
                  transition:"filter .2s" }}
                onError={e => { e.target.style.display="none"; }}
              />
              {st.shiny && !na && <span style={{ position:"absolute", bottom:-2, right:-3, fontSize:12 }}>✨</span>}
              {st.hundo && !na && (
                <div style={{ position:"absolute", top:-3, right:-3, width:15, height:15, borderRadius:"50%",
                  background:"#2ea043", display:"flex", alignItems:"center", justifyContent:"center" }}>
                  <span style={{ fontSize:8, color:"#fff", fontWeight:800, lineHeight:1 }}>IV</span>
                </div>
              )}
            </div>

            {/* Name + types */}
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ fontSize:13, fontWeight:500, lineHeight:1.3,
                color: done||na ? "#444" : "#e6edf3",
                textDecoration: done && !na ? "line-through" : "none",
                overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
                {boss.name}
              </div>
              <div style={{ display:"flex", gap:3, marginTop:3, flexWrap:"wrap" }}>
                {boss.types.map(t => <TypeBadge key={t} type={t} />)}
                {boss.regional && (
                  <span style={{ fontSize:9, fontWeight:600, padding:"2px 5px", borderRadius:3,
                    background:"#161e2e", color:"#5b84c4", lineHeight:1.2 }}>
                    🌍 {boss.regional}
                  </span>
                )}
                {hasNote && !expanded && (
                  <span style={{ fontSize:9, padding:"2px 4px", borderRadius:3,
                    background:"#1a1400", color:"#a07800", lineHeight:1.2 }}>📝</span>
                )}
              </div>
            </div>

            {/* Buttons */}
            <div style={{ display:"flex", gap:5, flexShrink:0, alignItems:"center" }}>
              <button onClick={onUnavail} style={{
                padding:"3px 7px", borderRadius:5, cursor:"pointer", fontSize:10, fontWeight:600,
                border:`1px solid ${na ? "#b8960a" : "#2d333b"}`,
                background: na ? "#1a130010" : "transparent",
                color: na ? "#F6C614" : "#444", transition:"all .15s",
              }}>{na ? "✕ N/A" : "N/A"}</button>
              <button onClick={() => setExpanded(e => !e)} style={{
                padding:"3px 8px", borderRadius:5, cursor:"pointer", fontSize:11,
                border:`1px solid ${expanded || hasActivity ? "#2d3a55" : "#1c2030"}`,
                background: expanded ? "#111825" : "transparent",
                color: hasActivity ? "#6d9cf8" : "#333", transition:"all .15s",
              }}>{expanded ? "▲" : "▼"}</button>
            </div>
          </div>

          {/* Expanded panel */}
          {expanded && (
            <div style={{ background:"#090c13", borderTop:"1px solid #1c2030", padding:"10px 12px 12px" }}>
              <div style={{ display:"flex", gap:12, alignItems:"flex-start" }}>
                {/* Large sprite */}
                <div style={{ flexShrink:0, width:70, height:70, background:"#0d1117", borderRadius:8,
                  display:"flex", alignItems:"center", justifyContent:"center", border:"1px solid #1c2030" }}>
                  <img src={boss.img} alt={boss.name} width={62} height={62}
                    style={{ objectFit:"contain" }}
                    onError={e => { e.target.style.display="none"; }}
                  />
                </div>
                {/* Notes + checks */}
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontSize:10, fontWeight:700, color:"#3d4a5c", textTransform:"uppercase",
                    letterSpacing:.8, marginBottom:5 }}>Notes</div>
                  <textarea
                    value={st.note || ""}
                    onChange={e => onNote(e.target.value)}
                    placeholder='e.g. "Skip today — available again Saturday in Astral Tides"'
                    rows={2}
                    style={{ width:"100%", background:"#0d1117", border:"1px solid #21262d",
                      borderRadius:6, color:"#c9d1d9", fontSize:12, padding:"6px 9px",
                      resize:"vertical", outline:"none", lineHeight:1.5 }}
                  />
                  <div style={{ display:"flex", gap:18, marginTop:8 }}>
                    <MiniCheck checked={!!st.hundo} onChange={onHundo} label="Got 100 IV" color="#2ea043" />
                    <MiniCheck checked={!!st.shiny} onChange={onShiny} label="Got Shiny ✨" color="#c8920a" />
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ── Main App ───────────────────────────────────────────────────────────────
    function App() {
      const [state,     setState]     = useState(() => loadState());
      const [activeTab, setActiveTab] = useState("all");
      const [collapsed, setCollapsed] = useState({});
      const [hideDone,  setHideDone]  = useState(false);
      const [hideNA,    setHideNA]    = useState(false);

      // Persist on every state change
      useEffect(() => { saveState(state); }, [state]);

      // Per-boss state helpers — all writes go through one setState
      const set = useCallback((id, key, val) => {
        setState(prev => ({ ...prev, [id]: { ...(prev[id] || {}), [key]: val } }));
      }, []);
      const toggle = useCallback((id, key) => {
        setState(prev => {
          const cur = prev[id] || {};
          return { ...prev, [id]: { ...cur, [key]: !cur[key] } };
        });
      }, []);
      const toggleCheck = (id) => {
        setState(prev => {
          const cur = prev[id] || {};
          if (cur.unavailable) return prev; // can't check an N/A row
          return { ...prev, [id]: { ...cur, checked: !cur.checked } };
        });
      };
      const toggleUnavail = (id) => {
        setState(prev => {
          const cur = prev[id] || {};
          const nowNA = !cur.unavailable;
          return { ...prev, [id]: { ...cur, unavailable: nowNA, checked: nowNA ? false : cur.checked } };
        });
      };

      // Stats
      const naCount    = ALL_BOSSES.filter(b => state[b.id]?.unavailable).length;
      const doneCount  = ALL_BOSSES.filter(b => state[b.id]?.checked).length;
      const hundoCount = ALL_BOSSES.filter(b => state[b.id]?.hundo).length;
      const shinyCount = ALL_BOSSES.filter(b => state[b.id]?.shiny).length;
      const available  = ALL_BOSSES.length - naCount;
      const pct        = available > 0 ? Math.round((doneCount / available) * 100) : 0;

      const visibleSections = SECTIONS.filter(s => activeTab === "all" || s.tab === activeTab);
      const TABS = [
        { id:"all",      label:"All" },
        { id:"leadup",   label:"📅 Lead-up" },
        { id:"saturday", label:"⭐ Saturday" },
        { id:"sunday",   label:"🌙 Sunday" },
      ];

      return (
        <div style={{ minHeight:"100vh", background:"#0d1117", color:"#e6edf3",
          fontFamily:"system-ui,-apple-system,sans-serif" }}>

          {/* Header */}
          <div style={{ background:"linear-gradient(160deg,#0e1f40,#180f38)",
            padding:"16px 14px 13px", borderBottom:"1px solid #1a2540", position:"sticky", top:0, zIndex:10 }}>
            <h1 style={{ fontSize:17, fontWeight:700, color:"#F6C614", letterSpacing:.3, marginBottom:2 }}>
              🎉 GO Fest 2026 · Raid Checklist
            </h1>
            <p style={{ fontSize:10, color:"#5a7299", marginBottom:10 }}>
              Jul 6–12 · Tap ▼ on any row for notes, shiny &amp; 100 IV tracking
            </p>
            {/* Progress bar */}
            <div style={{ display:"flex", justifyContent:"space-between", fontSize:10, color:"#5a7299", marginBottom:4 }}>
              <span>
                <span style={{ color:"#3fb950", fontWeight:700 }}>{doneCount}</span> raided ·{" "}
                <span style={{ color:"#F6C614", fontWeight:700 }}>{pct}%</span> of available
              </span>
              <span>💯 {hundoCount} · ✨ {shinyCount} · 🚫 {naCount}</span>
            </div>
            <div style={{ background:"#0d1522", borderRadius:6, height:6, overflow:"hidden" }}>
              <div style={{ background:"linear-gradient(90deg,#238636,#3fb950)",
                width:`${pct}%`, height:"100%", transition:"width .4s", borderRadius:6 }} />
            </div>
          </div>

          {/* Tab + filter bar */}
          <div style={{ background:"#0d1117", borderBottom:"1px solid #1c2030",
            display:"flex", alignItems:"center", overflowX:"auto", position:"sticky", top:88, zIndex:9 }}>
            {TABS.map(tab => (
              <button key={tab.id} onClick={() => setActiveTab(tab.id)} style={{
                padding:"10px 13px", background:"none", border:"none", cursor:"pointer",
                color: activeTab===tab.id ? "#F6C614" : "#6b7280",
                borderBottom:`2px solid ${activeTab===tab.id ? "#F6C614" : "transparent"}`,
                fontSize:12, fontWeight: activeTab===tab.id ? 700 : 400, whiteSpace:"nowrap",
              }}>{tab.label}</button>
            ))}
            <div style={{ marginLeft:"auto", display:"flex", gap:5, padding:"0 10px" }}>
              {[
                { active:hideDone, label:"Hide ✓", toggle:() => setHideDone(p=>!p) },
                { active:hideNA,   label:"Hide N/A", toggle:() => setHideNA(p=>!p) },
              ].map((f,k) => (
                <button key={k} onClick={f.toggle} style={{
                  padding:"4px 8px", borderRadius:10, cursor:"pointer", fontSize:10, fontWeight:600,
                  border:`1px solid ${f.active ? "#b8960a" : "#1c2030"}`,
                  background: f.active ? "#1a130020" : "transparent",
                  color: f.active ? "#F6C614" : "#444", whiteSpace:"nowrap",
                }}>{f.label}</button>
              ))}
            </div>
          </div>

          {/* Sections */}
          <div style={{ padding:"10px 10px 48px", maxWidth:700, margin:"0 auto" }}>
            {visibleSections.map(section => {
              const secBosses = section.groups.flatMap(g => g.bosses);
              const secNA     = secBosses.filter(b => state[b.id]?.unavailable).length;
              const secDone   = secBosses.filter(b => state[b.id]?.checked).length;
              const secAvail  = secBosses.length - secNA;
              const isOpen    = !collapsed[section.id];
              const allDone   = secAvail > 0 && secDone === secAvail;

              return (
                <div key={section.id} style={{ marginBottom:10, borderRadius:8,
                  overflow:"hidden", border:"1px solid #1c2030" }}>
                  {/* Section header */}
                  <div onClick={() => setCollapsed(p => ({ ...p, [section.id]: !p[section.id] }))}
                    style={{ background:"#111722", padding:"10px 14px", cursor:"pointer",
                      display:"flex", alignItems:"center", justifyContent:"space-between", userSelect:"none" }}>
                    <div>
                      <div style={{ fontSize:13, fontWeight:700, color: allDone ? "#3fb950" : "#c9d1d9" }}>
                        {section.title}
                      </div>
                      {section.subtitle && (
                        <div style={{ fontSize:10, color:"#4a6080", marginTop:2 }}>{section.subtitle}</div>
                      )}
                    </div>
                    <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                      <span style={{ fontSize:11, fontWeight:600, color: allDone ? "#3fb950" : "#444" }}>
                        {secDone}/{secAvail}
                      </span>
                      <span style={{ color:"#333", fontSize:10 }}>{isOpen ? "▼" : "▶"}</span>
                    </div>
                  </div>

                  {/* Groups */}
                  {isOpen && section.groups.map(group => {
                    const rows = group.bosses.filter(b => {
                      if (hideDone && state[b.id]?.checked && !state[b.id]?.unavailable) return false;
                      if (hideNA   && state[b.id]?.unavailable) return false;
                      return true;
                    });
                    if (!rows.length) return null;
                    const tc = TIER_COLORS[group.tier] || "#555";
                    return (
                      <div key={group.tier}>
                        <div style={{ padding:"3px 14px", fontSize:9, fontWeight:800, letterSpacing:1.3,
                          color:tc, background:"#070a0f", textTransform:"uppercase", borderTop:"1px solid #1c2030" }}>
                          {group.tier}
                        </div>
                        {rows.map(boss => (
                          <BossRow
                            key={boss.id}
                            boss={boss}
                            st={state[boss.id] || {}}
                            onCheck={()    => toggleCheck(boss.id)}
                            onUnavail={()  => toggleUnavail(boss.id)}
                            onHundo={()    => toggle(boss.id, "hundo")}
                            onShiny={()    => toggle(boss.id, "shiny")}
                            onNote={v      => set(boss.id, "note", v)}
                          />
                        ))}
                      </div>
                    );
                  })}
                </div>
              );
            })}

            {/* Reset */}
            <div style={{ textAlign:"center", marginTop:20 }}>
              <button
                onClick={() => { if (window.confirm("Reset all progress? This cannot be undone.")) setState({}); }}
                style={{ padding:"7px 18px", borderRadius:6, border:"1px solid #21262d",
                  background:"transparent", color:"#444", cursor:"pointer", fontSize:11 }}>
                Reset all progress
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
