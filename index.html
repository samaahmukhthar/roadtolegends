<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GO Wild Area 2026 · Raids</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d1117; color: #e6edf3; font-family: system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0d1117; }
    ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
    textarea:focus { border-color: #388bfd !important; }
    textarea, button { font-family: inherit; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    // ── Constants ──────────────────────────────────────────────────────────────
    const TYPE_COLORS = {
      Normal:   { bg:"#9FA19F", tx:"#fff" }, Fire:     { bg:"#E62829", tx:"#fff" },
      Water:    { bg:"#2980EF", tx:"#fff" }, Electric: { bg:"#FAC000", tx:"#000" },
      Grass:    { bg:"#3FA129", tx:"#fff" }, Ice:      { bg:"#3DCEF3", tx:"#000" },
      Fighting: { bg:"#FF8000", tx:"#fff" }, Poison:   { bg:"#9141CB", tx:"#fff" },
      Ground:   { bg:"#915121", tx:"#fff" }, Flying:   { bg:"#81B9EF", tx:"#000" },
      Psychic:  { bg:"#EF4179", tx:"#fff" }, Bug:      { bg:"#91A119", tx:"#fff" },
      Rock:     { bg:"#AFA981", tx:"#fff" }, Ghost:    { bg:"#704170", tx:"#fff" },
      Dragon:   { bg:"#5060E1", tx:"#fff" }, Dark:     { bg:"#624D4E", tx:"#fff" },
      Steel:    { bg:"#60A1B8", tx:"#fff" }, Fairy:    { bg:"#EF70EF", tx:"#fff" },
    };
    const TIER_COLORS = { "3-Star":"#E8A040", "5-Star":"#F6C614", "Max Battle":"#E0218A" };
    const PM = "https://raw.githubusercontent.com/PokeMiners/pogo_assets/master/Images/Pokemon/Addressable%20Assets/";
    const LD = "https://cdn.leekduck.com/assets/img/pokemon_icons/";
    const p = (icon) => `${PM}${icon}.icon.png`;

    // ── Raid Data ──────────────────────────────────────────────────────────────
    const SECTIONS = [
      // ── GO WILD AREA 2026: GLOBAL (Nov 14–15) ─────────────────────────────────
      { id:"wa-sat", tab:"saturday", title:"Saturday, November 14", subtitle:"10:00 AM – 6:00 PM local · Steel / Dragon",
        groups:[
          { tier:"3-Star", bosses:[
            {id:"wa-sat-machamp", name:"Machamp (Modern Jacket)", types:["Fighting"],         img:`${LD}pm68.fWILDAREA_2026_01.icon.png`},
          ]},
          { tier:"5-Star", bosses:[
            {id:"wa-zekrom",      name:"Zekrom",                types:["Dragon","Electric"],  img:p("pm644")},
            {id:"wa-kyurem-w",    name:"Kyurem (White)",        types:["Dragon","Ice"],       img:p("pm646.fWHITE")},
          ]},
          { tier:"Max Battle", bosses:[
            {id:"wa-sat-gmax-dura", name:"Gigantamax Duraludon", types:["Steel","Dragon"],    img:p("pm884")},
            {id:"wa-dmax-dialga", name:"Dynamax Dialga",        types:["Steel","Dragon"],     img:p("pm483")},
          ]},
        ],
      },
      { id:"wa-sun", tab:"sunday", title:"Sunday, November 15", subtitle:"10:00 AM – 6:00 PM local · Steel / Dragon",
        groups:[
          { tier:"3-Star", bosses:[
            {id:"wa-sun-machamp", name:"Machamp (Modern Jacket)", types:["Fighting"],         img:`${LD}pm68.fWILDAREA_2026_01.icon.png`},
          ]},
          { tier:"5-Star", bosses:[
            {id:"wa-reshiram",    name:"Reshiram",              types:["Dragon","Fire"],      img:p("pm643")},
            {id:"wa-kyurem-b",    name:"Kyurem (Black)",        types:["Dragon","Ice"],       img:p("pm646.fBLACK")},
          ]},
          { tier:"Max Battle", bosses:[
            {id:"wa-sun-gmax-dura", name:"Gigantamax Duraludon", types:["Steel","Dragon"],    img:p("pm884")},
            {id:"wa-dmax-palkia", name:"Dynamax Palkia",        types:["Water","Dragon"],     img:p("pm484")},
          ]},
        ],
      },
    ];

    const ALL_BOSSES = SECTIONS.flatMap(s => s.groups.flatMap(g => g.bosses));
    const LS_KEY = "wa26";

    function loadState()  { try { return JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch { return {}; } }
    function saveState(s) { try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch {} }

    // ── Canvas image export ────────────────────────────────────────────────────
    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
      ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
      ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
      ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
    }

    async function generateShareImage(bosses, subtitle) {
      const COLS     = Math.min(bosses.length, 5);
      const CARD_W   = 120, CARD_H = 148, PAD = 8;
      const HDR_H    = 78,  FTR_H  = 32;
      const rows     = Math.ceil(bosses.length / COLS);
      const W        = PAD + COLS*(CARD_W+PAD);
      const H        = HDR_H + rows*(CARD_H+PAD) + PAD + FTR_H;

      const canvas   = document.createElement("canvas");
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext("2d");

      // Background
      ctx.fillStyle = "#0d1117";
      ctx.fillRect(0, 0, W, H);

      // Header gradient
      const grad = ctx.createLinearGradient(0,0,W,0);
      grad.addColorStop(0,"#0e1f40"); grad.addColorStop(1,"#1c0a38");
      ctx.fillStyle = grad; ctx.fillRect(0,0,W,HDR_H);

      ctx.textAlign = "center";
      ctx.fillStyle = "#F6C614";
      ctx.font = "bold 18px system-ui,sans-serif";
      ctx.fillText("GO Wild Area 2026 — Raid Wish List", W/2, 30);
      ctx.fillStyle = "#6e88b3";
      ctx.font = "12px system-ui,sans-serif";
      ctx.fillText(subtitle || `${bosses.length} raids I need help with!`, W/2, 52);
      ctx.fillStyle = "#2a3550";
      ctx.fillRect(0, HDR_H-1, W, 1);

      // Load images (PokeMiners has CORS headers, so safe for canvas)
      const loadImg = src => new Promise(res => {
        const im = new Image(); im.crossOrigin = "anonymous";
        im.onload = () => res(im); im.onerror = () => res(null);
        im.src = src;
      });
      const imgs = await Promise.all(bosses.map(b => loadImg(b.img)));

      // Draw cards
      bosses.forEach((boss, idx) => {
        const col = idx % COLS;
        const row = Math.floor(idx / COLS);
        const x = PAD + col*(CARD_W+PAD);
        const y = HDR_H + PAD + row*(CARD_H+PAD);

        // Card bg
        ctx.fillStyle = "#161b22";
        roundRect(ctx, x, y, CARD_W, CARD_H, 7); ctx.fill();
        ctx.strokeStyle = "#21262d"; ctx.lineWidth = 1;
        roundRect(ctx, x, y, CARD_W, CARD_H, 7); ctx.stroke();

        // Sprite
        if (imgs[idx]) {
          ctx.drawImage(imgs[idx], x+(CARD_W-72)/2, y+6, 72, 72);
        } else {
          ctx.fillStyle = "#1c2030";
          roundRect(ctx, x+24, y+12, 72, 60, 5); ctx.fill();
          ctx.fillStyle = "#30363d"; ctx.font = "22px sans-serif"; ctx.textAlign = "center";
          ctx.fillText("?", x+CARD_W/2, y+48);
        }

        // Name
        ctx.fillStyle = "#c9d1d9";
        ctx.font = "bold 10px system-ui,sans-serif"; ctx.textAlign = "center";
        const name = boss.name.length > 17 ? boss.name.slice(0,15)+"…" : boss.name;
        ctx.fillText(name, x+CARD_W/2, y+88);

        // Type badges
        const bw = 52, bh = 15, bgap = 4;
        const totalW = boss.types.length*bw + (boss.types.length-1)*bgap;
        let bx = x + (CARD_W - totalW)/2;
        boss.types.forEach(type => {
          const tc = TYPE_COLORS[type] || {bg:"#555",tx:"#fff"};
          ctx.fillStyle = tc.bg;
          roundRect(ctx, bx, y+95, bw, bh, 3); ctx.fill();
          ctx.fillStyle = tc.tx;
          ctx.font = "bold 8px system-ui,sans-serif"; ctx.textAlign = "center";
          ctx.fillText(type.toUpperCase(), bx+bw/2, y+106);
          bx += bw + bgap;
        });

        // Regional badge
        if (boss.regional) {
          ctx.fillStyle = "#161e2e";
          roundRect(ctx, x+4, y+116, CARD_W-8, 14, 3); ctx.fill();
          ctx.fillStyle = "#5b84c4"; ctx.font = "7px system-ui,sans-serif"; ctx.textAlign = "center";
          ctx.fillText("REGIONAL: " + boss.regional.toUpperCase(), x+CARD_W/2, y+126);
        }
      });

      // Footer
      ctx.fillStyle = "#21262d"; ctx.fillRect(0, H-FTR_H, W, 1);
      ctx.fillStyle = "#3d4a5c"; ctx.font = "10px system-ui,sans-serif"; ctx.textAlign = "center";
      ctx.fillText("Generated " + new Date().toLocaleDateString(), W/2, H-12);

      try { return canvas.toDataURL("image/png"); }
      catch(e) { return null; }
    }

    // ── Share Modal ────────────────────────────────────────────────────────────
    function ShareModal({ appState, onClose }) {
      const needDefault = () => {
        const s = {};
        ALL_BOSSES.forEach(b => { if (!appState[b.id]?.checked && !appState[b.id]?.unavailable) s[b.id] = true; });
        return s;
      };
      const [sel,       setSel]       = useState(needDefault);
      const [subtitle,  setSubtitle]  = useState("Help me with these raids today!");
      const [imgData,   setImgData]   = useState(null);
      const [busy,      setBusy]      = useState(false);
      const [err,       setErr]       = useState(null);

      const picked = ALL_BOSSES.filter(b => sel[b.id]);

      const toggle = id => setSel(p => ({ ...p, [id]: !p[id] }));
      const selectNeeded = () => setSel(needDefault());
      const selectAll    = () => { const s = {}; ALL_BOSSES.filter(b => !appState[b.id]?.unavailable).forEach(b => s[b.id]=true); setSel(s); };
      const clearAll     = () => setSel({});

      const generate = async () => {
        if (!picked.length) return;
        setBusy(true); setErr(null); setImgData(null);
        const url = await generateShareImage(picked, subtitle);
        if (!url) setErr("Could not generate image — cross-origin issue. Try opening the app on GitHub Pages.");
        else setImgData(url);
        setBusy(false);
      };

      const download = () => {
        const a = document.createElement("a");
        a.href = imgData; a.download = "gofest2026-wishlist.png"; a.click();
      };

      return (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,.88)", zIndex:50,
          overflowY:"auto", WebkitOverflowScrolling:"touch" }}
          onClick={onClose}>
          <div style={{ minHeight:"100vh", padding:"12px", display:"flex", alignItems:"flex-start", justifyContent:"center" }}>
            <div style={{ width:"100%", maxWidth:640, background:"#0d1117", borderRadius:10,
              border:"1px solid #21262d", overflow:"hidden" }}
              onClick={e => e.stopPropagation()}>

              {/* Modal header */}
              <div style={{ background:"#111722", padding:"13px 16px", borderBottom:"1px solid #21262d",
                display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                <div>
                  <div style={{ fontSize:14, fontWeight:700, color:"#e6edf3" }}>📸 Build Raid Wish List Image</div>
                  <div style={{ fontSize:10, color:"#6e88b3", marginTop:2 }}>
                    {picked.length} selected — tap to toggle · then generate &amp; share
                  </div>
                </div>
                <button onClick={onClose} style={{ background:"none", border:"none", color:"#555",
                  cursor:"pointer", fontSize:20, lineHeight:1, padding:"0 4px" }}>✕</button>
              </div>

              {/* Quick-select toolbar */}
              <div style={{ padding:"8px 12px", borderBottom:"1px solid #1c2030", display:"flex", gap:6, flexWrap:"wrap", alignItems:"center" }}>
                <button onClick={selectNeeded} style={btnSm("#238636","#0d2016","#3fb950")}>Needed ({ALL_BOSSES.filter(b=>!appState[b.id]?.checked&&!appState[b.id]?.unavailable).length})</button>
                <button onClick={selectAll}    style={btnSm("#1f3a5f","#0a1525","#5b9cf6")}>All available</button>
                <button onClick={clearAll}     style={btnSm("#2d1a1a","#0d0a0a","#cf6679")}>Clear</button>
                <div style={{ marginLeft:"auto", fontSize:10, color:"#444" }}>{picked.length} selected</div>
              </div>

              {/* Boss grid */}
              <div style={{ padding:"10px 12px", maxHeight:"38vh", overflowY:"auto" }}>
                <div style={{ display:"flex", flexWrap:"wrap", gap:5 }}>
                  {ALL_BOSSES.filter(b => !appState[b.id]?.unavailable).map(boss => {
                    const on   = !!sel[boss.id];
                    const done = !!appState[boss.id]?.checked;
                    return (
                      <div key={boss.id} onClick={() => toggle(boss.id)}
                        style={{ width:74, cursor:"pointer", borderRadius:6, padding:"5px 3px 4px",
                          border:`2px solid ${on ? "#238636" : "#1c2030"}`,
                          background: on ? "#0b1e10" : "#090c13",
                          opacity: done ? .45 : 1, textAlign:"center", transition:"all .12s" }}>
                        <img src={boss.img} alt={boss.name} width={44} height={44}
                          style={{ objectFit:"contain", display:"block", margin:"0 auto",
                            filter: done ? "grayscale(1)" : "none" }}
                          onError={e => { e.target.style.display="none"; }}
                        />
                        <div style={{ fontSize:8, color: on ? "#3fb950" : "#444", fontWeight:600,
                          marginTop:3, lineHeight:1.2, overflow:"hidden",
                          textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{boss.name}</div>
                        {on && <div style={{ fontSize:9, color:"#3fb950", marginTop:1 }}>✓</div>}
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* Subtitle input */}
              <div style={{ padding:"8px 12px 4px" }}>
                <label style={{ fontSize:10, fontWeight:700, color:"#3d4a5c", textTransform:"uppercase", letterSpacing:.7 }}>
                  Image caption
                </label>
                <input
                  value={subtitle} onChange={e => setSubtitle(e.target.value)}
                  style={{ width:"100%", marginTop:4, background:"#0a0d13", border:"1px solid #21262d",
                    borderRadius:6, color:"#c9d1d9", fontSize:12, padding:"7px 10px", outline:"none" }}
                  placeholder="Help me with these raids today!"
                />
              </div>

              {/* Generate button */}
              <div style={{ padding:"8px 12px" }}>
                <button onClick={generate} disabled={!picked.length || busy} style={{
                  width:"100%", padding:"10px", borderRadius:6, border:"none", cursor: picked.length&&!busy ? "pointer" : "default",
                  background: picked.length&&!busy ? "#238636" : "#1a2030",
                  color: picked.length&&!busy ? "#fff" : "#444", fontSize:13, fontWeight:600,
                }}>
                  {busy ? "Generating…" : `Generate Image (${picked.length} Pokémon)`}
                </button>
                {err && <div style={{ fontSize:10, color:"#f85149", marginTop:6, textAlign:"center" }}>{err}</div>}
              </div>

              {/* Preview + download */}
              {imgData && (
                <div style={{ padding:"0 12px 16px" }}>
                  <img src={imgData} alt="Wish list preview"
                    style={{ width:"100%", borderRadius:6, border:"1px solid #21262d", display:"block" }} />
                  <button onClick={download} style={{
                    width:"100%", marginTop:8, padding:"10px", borderRadius:6,
                    border:"1px solid #1f6feb", background:"transparent",
                    color:"#5b9cf6", cursor:"pointer", fontSize:13, fontWeight:600,
                  }}>⬇ Download PNG</button>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    function btnSm(border, bg, color) {
      return { padding:"4px 10px", borderRadius:6, border:`1px solid ${border}`, background:bg,
        color, cursor:"pointer", fontSize:11, fontWeight:600 };
    }

    // ── BossRow components ─────────────────────────────────────────────────────
    function TypeBadge({ type }) {
      const c = TYPE_COLORS[type] || {bg:"#555",tx:"#fff"};
      return <span style={{ fontSize:9, fontWeight:700, padding:"2px 5px", borderRadius:3,
        background:c.bg, color:c.tx, textTransform:"uppercase", letterSpacing:.5, lineHeight:1.2 }}>{type}</span>;
    }

    function MiniCheck({ checked, onChange, label, color="#2ea043" }) {
      return (
        <label style={{ display:"flex", alignItems:"center", gap:5, cursor:"pointer", userSelect:"none" }}>
          <div onClick={onChange} style={{ width:16, height:16, borderRadius:3, flexShrink:0, cursor:"pointer",
            border:`2px solid ${checked ? color : "#30363d"}`, background: checked ? color : "transparent",
            display:"flex", alignItems:"center", justifyContent:"center", transition:"all .15s" }}>
            {checked && <span style={{ color:"#fff", fontSize:10, lineHeight:1, fontWeight:700 }}>✓</span>}
          </div>
          <span style={{ fontSize:11, color: checked ? color : "#555", fontWeight: checked ? 600 : 400 }}>{label}</span>
        </label>
      );
    }

    function BossRow({ boss, st, onCheck, onUnavail, onHundo, onShiny, onNote }) {
      const [expanded, setExpanded] = useState(false);
      const done = !!st.checked, na = !!st.unavailable;
      const hasNote = st.note && st.note.trim().length > 0;
      const hasActivity = st.hundo || st.shiny || hasNote;

      return (
        <div style={{ borderBottom:"1px solid #1c2030" }}>
          <div style={{ display:"flex", alignItems:"center", padding:"7px 12px",
            background: na ? "#080b10" : "#0d1117", gap:9, opacity: na ? .5 : 1, transition:"opacity .2s" }}>

            <div onClick={() => !na && onCheck()} style={{ width:22, height:22, borderRadius:5, flexShrink:0,
              border: na ? "2px solid #252525" : `2px solid ${done ? "#2ea043" : "#2d333b"}`,
              background: done && !na ? "#2ea043" : "transparent",
              display:"flex", alignItems:"center", justifyContent:"center",
              cursor: na ? "default" : "pointer", transition:"all .15s" }}>
              {na ? <span style={{ fontSize:12 }}>🚫</span>
               : done ? <span style={{ color:"#fff", fontSize:13, lineHeight:1 }}>✓</span> : null}
            </div>

            <div style={{ width:46, height:46, flexShrink:0, display:"flex", alignItems:"center",
              justifyContent:"center", position:"relative" }}>
              <img src={boss.img} alt={boss.name} width={46} height={46}
                style={{ objectFit:"contain", filter:(done||na) ? "grayscale(.75) brightness(.55)" : "none", transition:"filter .2s" }}
                onError={e => { e.target.style.display="none"; }} />
              {st.shiny && !na && <span style={{ position:"absolute", bottom:-2, right:-3, fontSize:12 }}>✨</span>}
              {st.hundo && !na && (
                <div style={{ position:"absolute", top:-3, right:-3, width:15, height:15, borderRadius:"50%",
                  background:"#2ea043", display:"flex", alignItems:"center", justifyContent:"center" }}>
                  <span style={{ fontSize:8, color:"#fff", fontWeight:800 }}>IV</span>
                </div>
              )}
            </div>

            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ fontSize:13, fontWeight:500, lineHeight:1.3,
                color: done||na ? "#444" : "#e6edf3",
                textDecoration: done&&!na ? "line-through" : "none",
                overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{boss.name}</div>
              <div style={{ display:"flex", gap:3, marginTop:3, flexWrap:"wrap" }}>
                {boss.types.map(t => <TypeBadge key={t} type={t} />)}
                {boss.regional && (
                  <span style={{ fontSize:9, fontWeight:600, padding:"2px 5px", borderRadius:3,
                    background:"#161e2e", color:"#5b84c4", lineHeight:1.2 }}>🌍 {boss.regional}</span>
                )}
                {hasNote && !expanded && (
                  <span style={{ fontSize:9, padding:"2px 4px", borderRadius:3,
                    background:"#1a1400", color:"#a07800", lineHeight:1.2 }}>📝</span>
                )}
              </div>
            </div>

            <div style={{ display:"flex", gap:5, flexShrink:0, alignItems:"center" }}>
              <button onClick={onUnavail} style={{ padding:"3px 7px", borderRadius:5, cursor:"pointer",
                fontSize:10, fontWeight:600,
                border:`1px solid ${na ? "#b8960a" : "#2d333b"}`,
                background: na ? "#1a130010" : "transparent",
                color: na ? "#F6C614" : "#444", transition:"all .15s" }}>{na ? "✕ N/A" : "N/A"}</button>
              <button onClick={() => setExpanded(e => !e)} style={{ padding:"3px 8px", borderRadius:5,
                cursor:"pointer", fontSize:11,
                border:`1px solid ${expanded||hasActivity ? "#2d3a55" : "#1c2030"}`,
                background: expanded ? "#111825" : "transparent",
                color: hasActivity ? "#6d9cf8" : "#333", transition:"all .15s" }}>{expanded ? "▲" : "▼"}</button>
            </div>
          </div>

          {expanded && (
            <div style={{ background:"#090c13", borderTop:"1px solid #1c2030", padding:"10px 12px 12px" }}>
              <div style={{ display:"flex", gap:12, alignItems:"flex-start" }}>
                <div style={{ flexShrink:0, width:70, height:70, background:"#0d1117", borderRadius:8,
                  display:"flex", alignItems:"center", justifyContent:"center", border:"1px solid #1c2030" }}>
                  <img src={boss.img} alt={boss.name} width={62} height={62}
                    style={{ objectFit:"contain" }} onError={e => { e.target.style.display="none"; }} />
                </div>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontSize:10, fontWeight:700, color:"#3d4a5c", textTransform:"uppercase",
                    letterSpacing:.8, marginBottom:5 }}>Notes</div>
                  <textarea value={st.note || ""} onChange={e => onNote(e.target.value)}
                    placeholder='e.g. "Missed Saturday — try again Sunday"'
                    rows={2}
                    style={{ width:"100%", background:"#0d1117", border:"1px solid #21262d",
                      borderRadius:6, color:"#c9d1d9", fontSize:12, padding:"6px 9px",
                      resize:"vertical", outline:"none", lineHeight:1.5 }} />
                  <div style={{ display:"flex", gap:18, marginTop:8 }}>
                    <MiniCheck checked={!!st.hundo} onChange={onHundo} label="Got 100 IV" color="#2ea043" />
                    <MiniCheck checked={!!st.shiny} onChange={onShiny} label="Got Shiny ✨" color="#c8920a" />
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ── Main App ───────────────────────────────────────────────────────────────
    function App() {
      const [state,     setState]     = useState(() => loadState());
      const [activeTab, setActiveTab] = useState("all");
      const [collapsed, setCollapsed] = useState({});
      const [hideDone,  setHideDone]  = useState(false);
      const [hideNA,    setHideNA]    = useState(false);
      const [showShare, setShowShare] = useState(false);

      useEffect(() => { saveState(state); }, [state]);

      const set = useCallback((id, key, val) => {
        setState(prev => ({ ...prev, [id]: { ...(prev[id]||{}), [key]: val } }));
      }, []);
      const toggle = useCallback((id, key) => {
        setState(prev => { const c=prev[id]||{}; return { ...prev, [id]: { ...c, [key]: !c[key] } }; });
      }, []);
      const toggleCheck = id => {
        setState(prev => { const c=prev[id]||{}; if(c.unavailable) return prev; return { ...prev, [id]: { ...c, checked: !c.checked } }; });
      };
      const toggleUnavail = id => {
        setState(prev => { const c=prev[id]||{}; const nowNA=!c.unavailable; return { ...prev, [id]: { ...c, unavailable: nowNA, checked: nowNA?false:c.checked } }; });
      };

      const naCount    = ALL_BOSSES.filter(b => state[b.id]?.unavailable).length;
      const doneCount  = ALL_BOSSES.filter(b => state[b.id]?.checked).length;
      const hundoCount = ALL_BOSSES.filter(b => state[b.id]?.hundo).length;
      const shinyCount = ALL_BOSSES.filter(b => state[b.id]?.shiny).length;
      const available  = ALL_BOSSES.length - naCount;
      const pct        = available > 0 ? Math.round((doneCount/available)*100) : 0;

      const visibleSections = SECTIONS.filter(s => activeTab==="all" || s.tab===activeTab);

      const TABS = [
        { id:"all",      label:"All" },
        { id:"saturday", label:"⚙️ Saturday" },
        { id:"sunday",   label:"🐉 Sunday" },
      ];

      return (
        <div style={{ minHeight:"100vh", background:"#0d1117", color:"#e6edf3",
          fontFamily:"system-ui,-apple-system,sans-serif" }}>

          {showShare && <ShareModal appState={state} onClose={() => setShowShare(false)} />}

          {/* Header */}
          <div style={{ background:"linear-gradient(160deg,#0e1f40,#180f38)",
            padding:"14px 14px 12px", borderBottom:"1px solid #1a2540",
            position:"sticky", top:0, zIndex:10 }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start" }}>
              <div>
                <h1 style={{ fontSize:16, fontWeight:700, color:"#F6C614", letterSpacing:.3, marginBottom:1 }}>
                  GO Wild Area 2026 · Raids
                </h1>
                <p style={{ fontSize:10, color:"#4a6080" }}>
                  Global · Nov 14–15 · tap ▼ for notes, shiny &amp; 100IV
                </p>
              </div>
              <button onClick={() => setShowShare(true)} style={{ padding:"6px 11px", borderRadius:7,
                border:"1px solid #2d3a55", background:"#111825", color:"#6d9cf8",
                cursor:"pointer", fontSize:12, fontWeight:600, whiteSpace:"nowrap", flexShrink:0 }}>
                📸 Share
              </button>
            </div>
            <div style={{ marginTop:10 }}>
              <div style={{ display:"flex", justifyContent:"space-between", fontSize:10, color:"#5a7299", marginBottom:4 }}>
                <span>
                  <span style={{ color:"#3fb950", fontWeight:700 }}>{doneCount}</span> raided ·{" "}
                  <span style={{ color:"#F6C614", fontWeight:700 }}>{pct}%</span> done
                </span>
                <span>💯 {hundoCount} · ✨ {shinyCount} · 🚫 {naCount}</span>
              </div>
              <div style={{ background:"#0d1522", borderRadius:6, height:6, overflow:"hidden" }}>
                <div style={{ background:"linear-gradient(90deg,#238636,#3fb950)",
                  width:`${pct}%`, height:"100%", transition:"width .4s", borderRadius:6 }} />
              </div>
            </div>
          </div>

          {/* Tab + filter bar */}
          <div style={{ background:"#0d1117", borderBottom:"1px solid #1c2030",
            display:"flex", alignItems:"center", overflowX:"auto",
            position:"sticky", top:93, zIndex:9 }}>
            {TABS.map(tab => (
              <button key={tab.id} onClick={() => setActiveTab(tab.id)} style={{
                padding:"10px 12px", background:"none", border:"none", cursor:"pointer",
                color: activeTab===tab.id ? "#F6C614" : "#6b7280",
                borderBottom:`2px solid ${activeTab===tab.id ? "#F6C614" : "transparent"}`,
                fontSize:11, fontWeight: activeTab===tab.id ? 700 : 400, whiteSpace:"nowrap",
              }}>{tab.label}</button>
            ))}
            <div style={{ marginLeft:"auto", display:"flex", gap:5, padding:"0 10px" }}>
              {[
                { active:hideDone, label:"Hide ✓", toggle:() => setHideDone(p=>!p) },
                { active:hideNA,   label:"Hide N/A", toggle:() => setHideNA(p=>!p) },
              ].map((f,k) => (
                <button key={k} onClick={f.toggle} style={{ padding:"4px 8px", borderRadius:10,
                  cursor:"pointer", fontSize:10, fontWeight:600,
                  border:`1px solid ${f.active ? "#b8960a" : "#1c2030"}`,
                  background: f.active ? "#1a130020" : "transparent",
                  color: f.active ? "#F6C614" : "#444", whiteSpace:"nowrap" }}>{f.label}</button>
              ))}
            </div>
          </div>

          {/* Sections */}
          <div style={{ padding:"10px 10px 48px", maxWidth:700, margin:"0 auto" }}>
            {/* Event notice banner */}
            <div style={{ background:"#0b1a1f", border:"1px solid #16404a", borderRadius:8,
              padding:"10px 14px", marginBottom:10, fontSize:11, color:"#5aa0b0", lineHeight:1.5 }}>
              <span style={{ fontWeight:700, color:"#60C8E0" }}>🌿 10 AM–6 PM local, both days</span> — Steel &amp; Dragon focus.
              Debuts: Gigantamax Duraludon (6-star Max Battles both days), Dynamax Dialga (Sat), Dynamax Palkia (Sun), Modern Jacket Machamp (3-star).
              Up to 3 free Raid Passes/day (6 with ticket). Raid Kyurem can know Glaciate; Black &amp; White Kyurem raids give Fusion Energy.
            </div>

            {visibleSections.map(section => {
              const secBosses = section.groups.flatMap(g => g.bosses);
              const secNA     = secBosses.filter(b => state[b.id]?.unavailable).length;
              const secDone   = secBosses.filter(b => state[b.id]?.checked).length;
              const secAvail  = secBosses.length - secNA;
              const isOpen    = !collapsed[section.id];
              const allDone   = secAvail > 0 && secDone === secAvail;

              return (
                <div key={section.id} style={{ marginBottom:10, borderRadius:8,
                  overflow:"hidden", border:"1px solid #1c2030" }}>
                  <div onClick={() => setCollapsed(p => ({ ...p, [section.id]: !p[section.id] }))}
                    style={{ background:"#111722", padding:"10px 14px", cursor:"pointer",
                      display:"flex", alignItems:"center", justifyContent:"space-between", userSelect:"none" }}>
                    <div>
                      <div style={{ fontSize:13, fontWeight:700, color: allDone ? "#3fb950" : "#c9d1d9" }}>
                        {section.title}
                      </div>
                      {section.subtitle && (
                        <div style={{ fontSize:10, color:"#4a6080", marginTop:2 }}>{section.subtitle}</div>
                      )}
                    </div>
                    <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                      <span style={{ fontSize:11, fontWeight:600, color: allDone ? "#3fb950" : "#444" }}>
                        {secDone}/{secAvail}
                      </span>
                      <span style={{ color:"#333", fontSize:10 }}>{isOpen ? "▼" : "▶"}</span>
                    </div>
                  </div>

                  {isOpen && section.groups.map(group => {
                    const rows = group.bosses.filter(b => {
                      if (hideDone && state[b.id]?.checked && !state[b.id]?.unavailable) return false;
                      if (hideNA   && state[b.id]?.unavailable) return false;
                      return true;
                    });
                    if (!rows.length) return null;
                    const tc = TIER_COLORS[group.tier] || "#555";
                    return (
                      <div key={group.tier}>
                        <div style={{ padding:"3px 14px", fontSize:9, fontWeight:800, letterSpacing:1.3,
                          color:tc, background:"#070a0f", textTransform:"uppercase",
                          borderTop:"1px solid #1c2030" }}>{group.tier}</div>
                        {rows.map(boss => (
                          <BossRow key={boss.id} boss={boss} st={state[boss.id]||{}}
                            onCheck={()  => toggleCheck(boss.id)}
                            onUnavail={()=> toggleUnavail(boss.id)}
                            onHundo={()  => toggle(boss.id,"hundo")}
                            onShiny={()  => toggle(boss.id,"shiny")}
                            onNote={v    => set(boss.id,"note",v)}
                          />
                        ))}
                      </div>
                    );
                  })}
                </div>
              );
            })}

            <div style={{ textAlign:"center", marginTop:20 }}>
              <button onClick={() => { if(window.confirm("Reset all progress? This cannot be undone.")) setState({}); }}
                style={{ padding:"7px 18px", borderRadius:6, border:"1px solid #21262d",
                  background:"transparent", color:"#444", cursor:"pointer", fontSize:11 }}>
                Reset all progress
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
